project:
  type: manuscript
  output-dir: ../_site/manuscript
latex-tinytex: false
pdf-engine: pdflatex
code-fold: true
code-tools: false

format:
  html:
    toc-depth: 3
    number-sections: false
  # preprint-pdf: 
  #   keep-tex: true

format-links:
  - text: Preprint
    href: https://doi.org/10.1101/2025.09.25.678481
    icon: pencil-square
  # - format: prerint-pdf
  #  text: Revision
  #  icon: file-earmark-check
  # - text: Journal version
  #   href: https://quarto.org
  #   icon: file-earmark-text

execute:
  eval: true
  output: false

notebook-view:
- title: "Figures"
  notebook: ../figures/all_figures.ipynb
  url: "../figures/all_figures.html"
- title: "Tables"
  notebook: ../tables/all_tables.ipynb
  url: "../tables/all_tables.html"
  